<!DOCTYPE html>
<html>
  <head>
    <title>Gradsquad - Home</title>
    <link rel="icon" type="image/png" href="public/favicon.png">
    <link rel="stylesheet" href="style.css">
    <style>
      :root {
        color-scheme: dark;
        --night: #06140d;
        --panel: #0b1c12;
        --panel-raised: #10271a;
        --green: #65f58a;
        --green-soft: #b8ffc5;
        --mint: #dcffe0;
        --sage: #8bb999;
        --line: #258446;
        --glow: 0 0 18px rgb(63 232 107 / 15%);
        --pixel-font: "Courier New", "Lucida Console", monospace;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        margin: 0;
        padding: 0;
        background: var(--night);
      }

      body {
        position: relative;
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        justify-content: flex-start;
        align-items: stretch;
        margin: 0;
        padding: 96px 0 24px;
        overflow-x: hidden;
        color: var(--mint) !important;
        font-family: var(--pixel-font);
        text-align: center;
        background-color: var(--night) !important;
        background-image:
          radial-gradient(circle, rgb(184 255 197 / 58%) 1px, transparent 1.5px),
          radial-gradient(circle, rgb(101 245 138 / 32%) 1px, transparent 1.5px),
          repeating-linear-gradient(0deg, transparent 0 3px, rgb(0 0 0 / 9%) 4px),
          radial-gradient(ellipse at 50% 0%, rgb(24 91 47 / 30%), transparent 70%);
        background-position: 7px 11px, 31px 29px, 0 0, center top;
        background-size: 59px 53px, 83px 71px, auto, auto;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 100;
        width: 100%;
        margin: 0;
        padding: 20px;
        color: var(--mint);
        font-size: 2.5em;
        font-weight: bold;
        background: var(--panel);
      }

      h1 {
        display: none;
      }

      .welcome-title {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 100;
        display: block;
        width: 100%;
        margin: 0;
        padding: 25px 18px;
        border-bottom: 2px solid var(--green);
        color: var(--green-soft);
        background: rgb(4 17 10 / 96%);
        box-shadow: 0 3px 18px rgb(0 0 0 / 35%), 0 2px 0 rgb(101 245 138 / 12%);
        font-family: var(--pixel-font);
        font-size: clamp(1rem, 3.5vw, 1.55rem);
        line-height: 1.4;
        text-shadow: 0 0 12px rgb(101 245 138 / 25%);
      }

      .forms-container {
        position: relative;
        left: 0;
        top: 0;
        display: flex;
        justify-content: center;
        gap: clamp(24px, 6vw, 80px);
        width: 100%;
        max-width: 1000px;
        margin: 0 auto;
        padding: 40px 20px;
      }

      .form-section {
        flex: 0 1 320px;
        min-width: 0;
        width: 320px;
      }

      .form-title {
        position: relative;
        z-index: 1;
        display: block;
        margin: 0;
        padding: 10px 14px;
        border: 1px solid var(--line);
        border-bottom: 0;
        color: var(--green-soft);
        background: var(--panel-raised);
        font-family: var(--pixel-font);
        font-size: 0.95rem;
        font-weight: 700;
        text-align: left;
        text-shadow: 2px 2px 0 #123d20;
        box-shadow: var(--glow);
      }

      form {
        width: 100%;
        padding: 22px clamp(16px, 4vw, 28px);
        border: 1px solid var(--line);
        border-radius: 2px;
        background:
          linear-gradient(135deg, rgb(101 245 138 / 5%) 0 8px, transparent 8px) top left / 12px 12px no-repeat,
          linear-gradient(315deg, rgb(101 245 138 / 5%) 0 8px, transparent 8px) bottom right / 12px 12px no-repeat,
          var(--panel);
        box-shadow: inset 0 0 0 3px rgb(4 17 10 / 75%), var(--glow);
        text-align: left;
      }

      form h3 {
        display: none;
      }

      input,
      select {
        width: 100%;
        min-height: 44px;
        margin: 8px 0;
        padding: 10px 12px;
        border: 1px solid #315c3d;
        border-radius: 1px;
        color: var(--mint);
        background: #07160d;
        font: 0.9rem var(--pixel-font);
        transition: border-color 120ms ease, box-shadow 120ms ease, background-color 120ms ease;
      }

      input::placeholder {
        color: var(--sage);
        opacity: 1;
      }

      input:hover,
      select:hover {
        border-color: var(--sage);
      }

      input:focus-visible,
      select:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--green-soft);
        outline-offset: 3px;
        border-color: var(--green);
        box-shadow: 0 0 0 3px rgb(101 245 138 / 18%);
      }

      input[type="date"] {
        color-scheme: dark;
      }

      button {
        width: 100%;
        min-height: 44px;
        margin-top: 10px;
        padding: 10px 12px;
        border: 1px solid var(--green);
        border-radius: 1px;
        color: #04130a;
        background: #59d875;
        box-shadow: inset 0 -3px 0 rgb(0 0 0 / 20%), 0 0 12px rgb(101 245 138 / 12%);
        font: 700 0.9rem var(--pixel-font);
        cursor: pointer;
        transition: background-color 120ms ease, box-shadow 120ms ease, transform 120ms ease;
      }

      button:hover {
        background: var(--green-soft);
        box-shadow: inset 0 -3px 0 rgb(0 0 0 / 16%), 0 0 16px rgb(101 245 138 / 30%);
        transform: translateY(-1px);
      }

      button:active {
        background: #43c463;
        box-shadow: inset 0 2px 0 rgb(0 0 0 / 16%);
        transform: translateY(1px);
      }

      @media (max-width: 800px) {
        .forms-container {
          top: 24px;
          flex-direction: column;
          align-items: center;
          gap: 28px;
          margin: 0 auto;
          padding: 28px 20px;
        }

        .form-section {
          flex: 0 1 auto;
          width: min(100%, 320px);
        }

        .form-title {
          margin: 0;
        }
      }

      @media (max-width: 360px) {
        .welcome-title {
          padding: 20px 12px;
        }

        .forms-container {
          padding-right: 14px;
          padding-left: 14px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <h1 class="welcome-title">Welcome to the Digital Memory Box: 2K27 🎓</h1>

    <div class="forms-container">
      <div class="form-section">
        <div class="form-title">Sign Up</div>
        <form id="signupForm">
          <input id="signupNickname" placeholder="Nickname" autocomplete="off" />
          <input id="signupPassword" type="password" placeholder="Password" autocomplete="off" />
          <input id="signupBirthdate" type="date" />
          <select id="signupColor" aria-label="Choose a color">
            <!-- populated by script -->
          </select>
          <input id="signupInviteCode" placeholder="Invite Code" autocomplete="off" />
          <button type="submit">Sign Up</button>
        </form>
      </div>

      <div class="form-section">
        <div class="form-title">Login</div>
        <form id="loginForm">
          <input id="loginNickname" placeholder="Nickname" autocomplete="off" />
          <input id="loginPassword" type="password" placeholder="Password" autocomplete="off" />
          <button type="submit">Log In</button>
        </form>
      </div>
    </div>

    <script>
      const API_BASE_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.protocol === 'file:')
        ? 'http://localhost:3000'
        : window.location.origin;

      const socketScript = document.createElement('script');
      socketScript.src = `${API_BASE_URL}/socket.io/socket.io.js`;
      socketScript.onload = () => {
        console.log('socket.io client loaded from', socketScript.src);
        if (typeof initSocket === 'function') initSocket();
      };
      socketScript.onerror = () => {
        console.warn('socket.io load failed, using CDN fallback');
        const fallback = document.createElement('script');
        fallback.src = 'https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.6.1/socket.io.min.js';
        fallback.onload = () => {
          console.log('socket.io client fallback loaded');
          if (typeof initSocket === 'function') initSocket();
        };
        document.head.appendChild(fallback);
      };
      document.head.appendChild(socketScript);

      let socket;
      function initSocket() {
        socket = io(API_BASE_URL);
        console.log('socket initialized', socket ? 'ok' : 'fail');

        socket.on('connect', () => console.log('socket connected'));
        socket.on('connect_error', (err) => console.error('socket connect_error', err));
        socket.on('disconnect', (reason) => console.warn('socket disconnected', reason));

        socket.on('signup success', (user) => {
          console.log('signup success', user);
          localStorage.setItem('nickname', user.nickname);
          localStorage.setItem('birthdate', user.birthdate);
          localStorage.setItem('color', user.color);
          localStorage.setItem('avatar', user.avatar);
          localStorage.setItem('admin', user.admin ? 'true' : 'false');
          window.location.href = 'dashboard.html';
        });

        socket.on('login success', (user) => {
          console.log('login success', user);
          localStorage.setItem('nickname', user.nickname);
          localStorage.setItem('birthdate', user.birthdate);
          localStorage.setItem('color', user.color);
          localStorage.setItem('avatar', user.avatar);
          localStorage.setItem('admin', user.admin ? 'true' : 'false');
          window.location.href = 'dashboard.html';
        });

        socket.on('signup error', msg => {
          console.error('signup error', msg);
          alert(msg);
        });

        socket.on('login error', msg => {
          console.error('login error', msg);
          alert(msg);
        });

        socket.on('available colors', colors => {
          if (Array.isArray(colors) && colors.length) {
            populateColors(colors);
          }
        });
      }

      // Fallback color list (used immediately so select is never empty)
      const fallbackColors = [
        { name: 'Teal', hex: '#2a9d8f' },
        { name: 'Blue', hex: '#3b82f6' },
        { name: 'Purple', hex: '#8b5cf6' },
        { name: 'Orange', hex: '#f97316' },
        { name: 'Green', hex: '#10b981' },
        { name: 'Pink', hex: '#ec4899' }
      ];

      const signupColor = document.getElementById('signupColor');

      // Utility: compute readable text color (black/white) for contrast
      function readableTextColor(hex) {
        // strip #
        const h = hex.replace('#','');
        const r = parseInt(h.substring(0,2),16);
        const g = parseInt(h.substring(2,4),16);
        const b = parseInt(h.substring(4,6),16);
        // luminance formula
        const luminance = (0.299*r + 0.587*g + 0.114*b) / 255;
        return luminance > 0.6 ? '#111' : '#fff';
      }

      // Populate select with given colors array
      function populateColors(colors) {
        signupColor.innerHTML = '';
        // placeholder option
        const placeholder = document.createElement('option');
        placeholder.value = '';
        placeholder.textContent = 'Choose a color';
        placeholder.disabled = true;
        placeholder.selected = true;
        signupColor.appendChild(placeholder);

        colors.forEach(c => {
          const opt = document.createElement('option');
          opt.value = c.hex;
          opt.textContent = c.name;
          // style option background and text for better visibility in many browsers
          // Note: some browsers ignore option styling, but this helps where supported.
          opt.style.backgroundColor = c.hex;
          opt.style.color = readableTextColor(c.hex);
          signupColor.appendChild(opt);
        });
      }

      // Immediately populate with fallback so the control is usable even if socket event is delayed
      populateColors(fallbackColors);

      // Pre-fill invite code from URL (e.g. /?invite=CODE)
      const urlParams = new URLSearchParams(window.location.search);
      const inviteFromUrl = urlParams.get('invite');
      if (inviteFromUrl) {
        const inviteInput = document.getElementById('signupInviteCode');
        inviteInput.value = inviteFromUrl;
      }

      // Form handlers
      function emitOrAlert(event, payload) {
        if (!socket || !socket.connected) {
          alert('Not connected to backend. Please refresh and ensure backend is reachable.');
          return;
        }
        socket.emit(event, payload);
      }

      document.getElementById('signupForm').addEventListener('submit', e => {
        e.preventDefault();
        emitOrAlert('signup', {
          nickname: document.getElementById('signupNickname').value,
          password: document.getElementById('signupPassword').value,
          birthdate: document.getElementById('signupBirthdate').value,
          color: signupColor.value,
          inviteCode: document.getElementById('signupInviteCode').value
        });
      });

      document.getElementById('loginForm').addEventListener('submit', e => {
        e.preventDefault();
        emitOrAlert('login', {
          nickname: document.getElementById('loginNickname').value,
          password: document.getElementById('loginPassword').value
        });
      });

      // socket handlers are configured inside initSocket() after io loads and connects.
    </script>
  </body>
</html>
